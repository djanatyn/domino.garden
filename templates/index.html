<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="pictures of domino (cat)" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />

    <meta property="og:title" content="domino's garden" />
    <meta property="og:description" content="pictures of domino (cat)" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://domino.garden" />
    <meta property="og:image" content="https://assets.domino.garden/file/domino-garden-public/photos/full/20869ba3af8d.webp" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="domino's garden" />
    <meta property="twitter:description" content="pictures of domino (cat)" />
    <meta property="twitter:image" content="https://assets.domino.garden/file/domino-garden-public/photos/full/20869ba3af8d.webp" />

    <title>domino's garden</title>
    <link rel="stylesheet" href="/static/domino.css" />
    <link
      rel="stylesheet"
      href="/static/vendor/photoswipe/photoswipe.css"
    />
  </head>
  <body class="bg-stone-50 text-neutral-950">
    <main class="min-h-screen">
      <header class="mx-auto max-w-5xl px-4 py-8 text-center">
        <h1 class="text-3xl font-bold tracking-tight sm:text-5xl">
          domino's garden
        </h1>
      </header>

      <section
        id="gallery"
        class="grid grid-cols-2 gap-2 p-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-8 xl:grid-cols-10"
        aria-label="Photo gallery"
      >
          {% for photo in photos %}<a href="{{photo.href}}" data-pswp-width="{{photo.width}}" data-pswp-height="{{photo.height}}" target="_blank" class="aspect-square overflow-hidden rounded-xl bg-neutral-100 shadow-md transition duration-200 hover:scale-[1.02] hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-amber-300"> <img src="{{photo.src}}" alt="{{photo.alt}}" class="h-full w-full object-cover" loading="lazy" decoding="async" /></a>{% endfor %}
      </section>
    </main>

    <script type="module">
      import PhotoSwipeLightbox from "/static/vendor/photoswipe/photoswipe-lightbox.esm.js";
      import PhotoSwipe from "/static/vendor/photoswipe/photoswipe.esm.js";

      const lightbox = new PhotoSwipeLightbox({
        gallery: "#gallery",
        children: "a",
        pswpModule: PhotoSwipe,
      });

      lightbox.init();
    </script>
  </body>
</html>
